<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
  <rect width="768" height="768" fill="#0a3a2a"/>
  
  <!-- Robot Head -->
  <circle cx="384" cy="150" r="15" fill="#84cc16"/>
  <rect x="384" y="150" width="4" height="30" fill="#84cc16"/>
  
  <!-- Robot Face -->
  <rect x="290" y="160" width="188" height="100" rx="50" fill="#84cc16"/>
  <rect x="310" y="180" width="148" height="60" rx="30" fill="#0a3a2a"/>
  
  <!-- Eyes -->
  <circle cx="340" cy="210" r="12" fill="#84cc16"/>
  <circle cx="428" cy="210" r="12" fill="#84cc16"/>
  
  <!-- Smile -->
  <path d="M 360 225 Q 384 235 408 225" stroke="#84cc16" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Ears -->
  <circle cx="280" cy="210" r="20" fill="#84cc16"/>
  <circle cx="488" cy="210" r="20" fill="#84cc16"/>
  
  <!-- Robot Body -->
  <circle cx="384" cy="360" r="130" fill="#84cc16" stroke="#0a3a2a" stroke-width="8"/>
  <circle cx="384" cy="360" r="110" fill="#0a3a2a"/>
  
  <!-- Wheat/Plant Icon in Body -->
  <!-- Center stalk -->
  <rect x="382" y="310" width="4" height="100" fill="#eab308"/>
  
  <!-- Wheat grains -->
  <ellipse cx="375" cy="320" rx="8" ry="12" fill="#eab308"/>
  <ellipse cx="393" cy="320" rx="8" ry="12" fill="#eab308"/>
  <ellipse cx="372" cy="340" rx="8" ry="12" fill="#eab308"/>
  <ellipse cx="396" cy="340" rx="8" ry="12" fill="#eab308"/>
  <ellipse cx="375" cy="360" rx="8" ry="12" fill="#eab308"/>
  <ellipse cx="393" cy="360" rx="8" ry="12" fill="#eab308"/>
  
  <!-- Leaves -->
  <ellipse cx="340" cy="380" rx="35" ry="20" fill="#84cc16" transform="rotate(-30 340 380)"/>
  <ellipse cx="428" cy="380" rx="35" ry="20" fill="#84cc16" transform="rotate(30 428 380)"/>
  
  <!-- Text -->
  <text x="384" y="540" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">SEMMA-AI</text>
  <text x="384" y="600" font-family="Arial, sans-serif" font-size="28" fill="#84cc16" text-anchor="middle">Smarter advice. Bigger harvests.</text>
</svg>